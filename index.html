grand(){const R_=V.dr||[],wk=Date.now()-7*864e5;return `<div class="card"><h2>📚 Grand Report — Departments</h2>${V.cu?'':'<p>⚠ Cloud sign-in needed (Parent Feedback page).</p>'}<div class="bar"><button onclick="print()">🖨 Print</button></div><div class="sc"><table><tr><th>Department<th>Head<th>Last report<th>Status</tr>${S.dp.map(d=>{const l=R_.find(r=>r.dept==d.id),ok=l&&l.ts&&l.ts.toMillis()>wk;return `<tr><td>${e(d.name)}<td>${e(d.head)}<td>${l?e(l.wk):'—'}<td>${ok?'<span class="pill ok">On time</span>':'<span class="pill no">Overdue</span>'}`}).join('')}</table></div></div>${R_.map(r=>{const d=S.dp.find(x=>x.id==r.dept);return `<div class="card"><h3>${e(d?d.name:r.dept)} — week of ${e(r.wk)}</h3><p><b>Agenda:</b> ${e(r.agenda)}</p><p><b>Participation:</b> ${e(r.att)}</p><p><b>Discussion:</b> ${e(r.notes)}</p><p><b>Next plan:</b> ${e(r.next)}</p><p><small>Submitted ${e(r.at)}</small> <button class="x noprint" onclick="drDel('${r.id}')">Delete</button></p></div>`}).join('')}`},
